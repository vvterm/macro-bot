name: Macro Bot

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 08:00 Stockholm
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyTelegramBotAPI yfinance requests

      - name: Run bot
        run: python bot.py
